<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tilemap Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 class="sr-only">Tilemap Editor</h1>

  <main id="editor">
    <!-- =====  Work‑area: tilemap + options ===== -->
    <div id="workspace">
      <!-- Level Tilemap -->
      <div id="tilemap" class="grid"></div>

      <!-- Options Panel -->
      <aside id="options" class="panel">
        <h2>Options</h2>
        <label>
          <input type="checkbox" id="toggle-numbers" checked>
          Show numbers
        </label>
        <label>
          <input type="checkbox" id="toggle-colours" checked>
          Show colours
        </label>
      </aside>
    </div>

    <!-- Palette -->
    <div id="palette"></div>

    <!-- Export & copy -->
    <div id="export-area">
      <textarea id="export" rows="8" cols="65" readonly></textarea>
      <button id="copy">Copy&nbsp;to&nbsp;clipboard</button>
    </div>
  </main>

  <script>
    /* ===================================================== *
     *               Tilemap Editor — main JS                *
     * ===================================================== */
    
    /* ====== Adjustable grid constants ====== */
    const ROWS    = 15;        // height  — change freely
    const COLS    = 16;        // width   — change freely
    const CELL_PX = 32;        // square size in pixels
    
    /* ====== DOM shortcuts ====== */
    const tilemap    = document.getElementById('tilemap');
    const palette    = document.getElementById('palette');
    const exportBox  = document.getElementById('export');
    const copyBtn    = document.getElementById('copy');
    const chkNumbers = document.getElementById('toggle-numbers');
    const chkColours = document.getElementById('toggle-colours');
    
    /* ====== Colour swatch (# index → colour string) ====== */
    const COLOURS = [
      '#ffffff',                               // 0 white
      'rgba(173,216,230,0.8)',                 // 1 ──┐
      'rgba(135,206,235,0.8)',                 // 2   │
      'rgba(135,206,250,0.8)',                 // 3   │  progressively
      'rgba(0,191,255,0.8)',                   // 4   │  darker blues
      'rgba(30,144,255,0.8)',                  // 5   │
      'rgba(0,128,255,0.8)',                   // 6   │
      'rgba(0,0,205,0.8)',                     // 7   │
      'rgba(25,25,112,0.8)',                   // 8 ──┘
      'rgba(0,0,139,0.8)'                      // 9 darkest blue
    ];
    
    /* ====== State ====== */
    let currentTile   = 0;     // palette selection
    let painting      = false; // true while mouse‑drag painting
    let lastHoverCell = null;  // tracks the cell currently outlined
    
    /* ===================================================== *
     *              Build palette & grid on load             *
     * ===================================================== */
    
    /* -- palette ---------------------------------------------------- */
    for (let i = 0; i <= 9; i++) {
      const btn              = document.createElement('button');
      btn.className          = 'tile-btn';
      btn.dataset.tile       = i;
      btn.textContent        = i;
      btn.style.backgroundColor = COLOURS[i];
      if (i === currentTile) btn.classList.add('selected');
      palette.appendChild(btn);
    }
    
    /* -- grid ------------------------------------------------------- */
    tilemap.style.setProperty('--rows', ROWS);
    tilemap.style.setProperty('--cols', COLS);
    tilemap.style.setProperty('--cell-size', CELL_PX + 'px');
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell       = document.createElement('div');
        cell.className   = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.textContent = 0;                     // initial value
        tilemap.appendChild(cell);
      }
    }
    
    /* ===================================================== *
     *                   Helper functions                    *
     * ===================================================== */
    
    /* Update current palette selection */
    function updateSelection(tile) {
      currentTile = tile;
      document.documentElement.style
              .setProperty('--current-colour', COLOURS[tile]); // ghost outline
      document.querySelectorAll('.tile-btn').forEach(btn =>
        btn.classList.toggle('selected', Number(btn.dataset.tile) === tile)
      );
    }
    
    /* Paint a single cell */
    function paint(cell) {
      cell.textContent          = currentTile;
      cell.style.backgroundColor = COLOURS[currentTile];
    }
    
    /* Export grid data to textarea (each row ends with a comma) */
    function exportData() {
      let out = '';
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push(tilemap.children[r * COLS + c].textContent);
        }
        out += row.join(',') + ',\n';           // ← trailing comma
      }
      exportBox.value = out.trimEnd();
    }
    
    /* ===================================================== *
     *                 Event wiring — Palette                *
     * ===================================================== */
    palette.addEventListener('click', e => {
      if (e.target.matches('.tile-btn'))
        updateSelection(Number(e.target.dataset.tile));
    });
    
    /* ===================================================== *
     *      Event wiring — Painting & fixed Ghost outline    *
     * ===================================================== */
    
    /* Start paint */
    tilemap.addEventListener('mousedown', e => {
      if (e.target.matches('.cell')) {
        painting = true;
        paint(e.target);
      }
    });
    
    /* Drag paint */
    tilemap.addEventListener('mouseover', e => {
      if (painting && e.target.matches('.cell')) paint(e.target);
    });
    
    /* Stop paint */
    window.addEventListener('mouseup', () => (painting = false));
    
    /* --------  Ghost‑outline logic (no lingering outline)  -------- */
    
    /* Outline the cell under cursor; clear the previous one */
    tilemap.addEventListener('mousemove', e => {
      if (!e.target.matches('.cell')) return;
    
      /* clear outline from previously hovered cell */
      if (lastHoverCell && lastHoverCell !== e.target)
        lastHoverCell.style.outlineColor = 'transparent';
    
      /* apply outline to the new cell */
      e.target.style.outlineColor = COLOURS[currentTile];
      lastHoverCell = e.target;
    });
    
    /* Remove outline completely when leaving the grid */
    tilemap.addEventListener('mouseleave', () => {
      if (lastHoverCell) {
        lastHoverCell.style.outlineColor = 'transparent';
        lastHoverCell = null;
      }
    });
    
    /* ===================================================== *
     *              Event wiring — Options panel             *
     * ===================================================== */
    chkNumbers.addEventListener('change',
      () => tilemap.classList.toggle('hide-numbers', !chkNumbers.checked)
    );
    
    chkColours.addEventListener('change',
      () => tilemap.classList.toggle('hide-colours', !chkColours.checked)
    );
    
    /* ===================================================== *
     *              Export & Copy‑to‑clipboard               *
     * ===================================================== */
    copyBtn.addEventListener('click', () => {
      exportData();                       // refresh text
      exportBox.select();
      document.execCommand('copy');       // copy to clipboard
    });
    
    /* Keep textarea updated if user clicks inside area */
    document.getElementById('export-area')
            .addEventListener('click', exportData);
    
    /* Initial textarea contents */
    exportData();
    </script>
</body>
</html>
